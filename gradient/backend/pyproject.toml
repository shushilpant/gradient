[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-backend"
version = "0.1.0"
description = "Stateless FastAPI service for GRADIENT: SymPy verification, OR-Tools optimization, and schema-constrained LLM proxy"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn==0.32.0",
    "pydantic==2.9.2",
    "sympy==1.13.3",
    "ortools==9.11.4210",
    "python-dotenv==1.0.1",
    "pypdf>=5.0,<7",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "playwright>=1.51,<2",
]

[project.optional-dependencies]
speech = ["kokoro-onnx>=0.4,<0.5", "soundfile>=0.13,<0.15"]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]

[tool.setuptools]
py-modules = [
    "app", "assignment_pdf", "change_radar", "computer_agent", "leak_guard",
    "local_assistant", "packet_share", "photo_check", "policy_extractor",
    "public_search", "retrieval_service", "reu_finder", "rubric_feedback", "safe_math",
    "sandbox_mirror", "scheduler_service", "speech_service", "visual_renderer",
]

