[project]
name = "gradient-backend"
version = "0.1.0"
description = "Stateless FastAPI service for GRADIENT: SymPy verification, OR-Tools optimization, and schema-constrained LLM proxy"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn==0.32.0",
    "pydantic==2.9.2",
    "sympy==1.13.3",
    "ortools==9.11.4210",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]

