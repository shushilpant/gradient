worker_processes 1;
pid /tmp/gradient-nginx.pid;
events { worker_connections 128; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 100m;
  client_body_temp_path /tmp/gradient-body;
  proxy_temp_path /tmp/gradient-proxy;
  fastcgi_temp_path /tmp/gradient-fastcgi;
  uwsgi_temp_path /tmp/gradient-uwsgi;
  scgi_temp_path /tmp/gradient-scgi;
  server {
    listen 8080;
    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }
  }
}
