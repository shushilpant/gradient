name: bodha-canvas-local
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_PASSWORD: ${CANVAS_DATABASE_PASSWORD:?Run setup.py configure first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [sandbox]
  redis:
    image: redis:7-alpine
    networks: [sandbox]
  gateway:
    image: instructure/ruby-passenger:3.4-jammy
    command: nginx -c /bodha-gateway.conf -g "daemon off;"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./gateway.conf:/bodha-gateway.conf:ro
    depends_on: [web]
    networks: [sandbox, ingress]
  web:
    build:
      context: ./upstream
      dockerfile: Dockerfile
      args:
        USER_ID: ${CANVAS_HOST_UID:-501}
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    environment:
      RAILS_ENV: development
      POSTGRES_PASSWORD: ${CANVAS_DATABASE_PASSWORD}
      CANVAS_DATABASE_HOST: postgres
      CANVAS_DATABASE_USERNAME: postgres
      CANVAS_DATABASE_DEVELOPMENT: canvas_development
      ENCRYPTION_KEY: ${CANVAS_ENCRYPTION_KEY:?Run setup.py configure first}
      CANVAS_LMS_ADMIN_EMAIL: ${CANVAS_ADMIN_EMAIL}
      CANVAS_LMS_ADMIN_PASSWORD: ${CANVAS_ADMIN_PASSWORD}
      CANVAS_LMS_ACCOUNT_NAME: OffCanvas Local Sandbox
      CANVAS_LMS_STATS_COLLECTION: opt_out
    volumes:
      - ./upstream:/usr/src/app
      - ./.runtime:/bodha-runtime
      - gems:/home/docker/.gem
      - bundle:/home/docker/.bundle
      - modules:/usr/src/app/node_modules
      - cache:/home/docker/.cache/yarn
      - assets:/usr/src/app/public/dist
      - files:/usr/src/app/tmp/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [sandbox]
networks:
  sandbox:
    internal: true
  ingress: {}
volumes:
  postgres: {}
  gems: {}
  bundle: {}
  modules: {}
  cache: {}
  assets: {}
  files: {}
